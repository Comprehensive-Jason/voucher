# Builds the Windows installer: the Voucher app with the voucher-guard
# service bundled beside it. Runs on pushes that touch the app or the
# crates, and by hand; the installer is attached to the run as an artifact.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/voucher/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/voucher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the Ledger, protocol, and guard
        run: cargo test -p voucher-protocol -p voucher-ledger -p voucher-guard

      - name: Build the guard and place it where Tauri bundles sidecars
        shell: bash
        run: |
          cargo build --release -p voucher-guard
          mkdir -p apps/voucher/src-tauri/binaries
          cp target/release/voucher-guard.exe apps/voucher/src-tauri/binaries/voucher-guard-x86_64-pc-windows-msvc.exe

      - name: Build the installer
        working-directory: apps/voucher
        run: |
          npm ci
          npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v5
        with:
          name: voucher-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
