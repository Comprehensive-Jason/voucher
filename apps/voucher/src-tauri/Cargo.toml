[package]
name = "voucher-app"
version = "0.1.0"
description = "Voucher: earn-to-unlock app and website blocker"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "voucher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voucher-protocol = { path = "../../../crates/voucher-protocol" }
# Plain HTTP: the Ledger is reached over Tailscale, which already encrypts the link.
ureq = { version = "3.4.2", default-features = false }
jiff = { version = "0.2.38", features = ["serde"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Windows: listing running programs for blocklists.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# The window in front (blocked-site detection), Ctrl+W for "Close this tab",
# and time on websites: the browser's program, idle time, and its address bar
# read through UI Automation (COM).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
