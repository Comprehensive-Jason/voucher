<!doctype html>
<!--
  Claude: THROWAWAY PROTOTYPE. Written by Claude Opus 5.5 (claude-opus-5-5) on 2026-10-06
  for the Voucher UI round 3 brief (prototypes/ROUND3-BRIEF.md). Not production code.
  Variants: opus-1 "Stub" (tear a ticket), opus-2 "Twelve" (hold the dial).
  URL params: ?variant=opus-1|opus-2  &state=locked|running|curfew|full  &device=phone|tablet|windows|widgets
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voucher R3 Opus</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:#060609;color:#e9e8ee;font-family:Roboto,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"DejaVu Sans",sans-serif;-webkit-font-smoothing:antialiased;padding:24px 24px 120px;min-height:100vh}
.num{font-variant-numeric:tabular-nums}
.ic{display:inline-block;vertical-align:middle;flex:none}
#stage{display:flex;flex-direction:column;gap:22px;width:max-content;margin:0 auto;padding:6px}
.stage-head{display:flex;align-items:baseline;gap:14px;color:#8d8c98;font-size:13px}
.stage-head b{color:#f1f0f5;font-size:17px;font-weight:700}
.stage-head .k{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:12px;color:#6f6e7a}
.row{display:flex;gap:26px;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:8px}
.cap{font-size:12px;color:#8d8c98;line-height:1.35;max-width:100%}
.cap b{color:#e2e1e8;font-weight:600}
.cap .sys{color:#f2b55f;font-weight:600}
.cap .note{display:block;color:#6f6e7a}

/* device frames */
.phone{width:330px;height:690px;border-radius:40px;background:#000;border:2px solid #2b2b31;position:relative;overflow:hidden;box-shadow:0 0 0 6px #111115,0 20px 50px #0008;flex:none}
.tablet{width:1180px;height:740px;border-radius:26px;background:#000;border:2px solid #2b2b31;position:relative;overflow:hidden;box-shadow:0 0 0 10px #111115,0 20px 50px #0008;flex:none}
.scr{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;font-size:12px;font-weight:600;color:#fff;position:relative;z-index:3}
.sbar .cam{width:11px;height:11px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #151518;position:absolute;left:50%;top:10px;transform:translateX(-50%)}
.sbar .r{display:flex;gap:5px;align-items:center}
.tablet .sbar{padding:0 26px;height:30px}
.tablet .sbar .cam{display:none}

/* app tiles */
.app{display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.app svg{width:62%;height:62%}

/* ---------- Android system UI (shared, not ours) ---------- */
.wall{position:absolute;inset:0;background:radial-gradient(120% 70% at 20% 10%,#24324d 0%,transparent 60%),radial-gradient(90% 60% at 90% 80%,#3a2a4a 0%,transparent 60%),linear-gradient(180deg,#10131c,#07080c)}
.launcher{position:absolute;inset:30px 0 0;padding:18px 16px;display:flex;flex-direction:column}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;justify-items:center}
.lapp{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:#e9e9ee;text-shadow:0 1px 2px #000a}
.dock{position:absolute;left:14px;right:14px;bottom:18px;height:70px;border-radius:26px;background:#ffffff14;display:flex;align-items:center;justify-content:space-around;backdrop-filter:blur(10px)}
.navpill{position:absolute;left:50%;bottom:6px;width:110px;height:4px;border-radius:2px;background:#ffffffaa;transform:translateX(-50%);z-index:5}
.scrim{position:absolute;inset:0;background:#000a}
.oneui-dlg{position:absolute;left:12px;right:12px;bottom:26px;border-radius:26px;background:#232326;padding:22px 22px 8px;color:#f2f2f5;z-index:4}
.oneui-dlg .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.oneui-dlg h3{font-size:19px;font-weight:700}
.oneui-dlg p{font-size:14px;line-height:1.45;color:#c9c9cf;margin-bottom:14px}
.oneui-dlg .btns{display:flex;border-top:1px solid #ffffff12;margin:0 -10px}
.oneui-dlg .btns span{flex:1;text-align:center;padding:14px 0;font-size:15px;font-weight:600;color:#7cacf8}
.oneui-dlg .btns span+span{border-left:1px solid #ffffff12}
.shade{position:absolute;inset:0;background:#0b0b0eee;backdrop-filter:blur(14px);padding:44px 14px 0;z-index:4}
.shade .qs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.shade .qs i{height:52px;border-radius:18px;background:#2a2a30;display:block}
.shade .qs i.on{background:#3d6fd1}
.ntf{background:#1f1f24;border-radius:22px;padding:14px 16px;color:#eee}
.ntf .top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#a9a9b2}
.ntf .t{font-size:15px;font-weight:700;margin:8px 0 3px}
.ntf .b{font-size:13px;color:#c9c9cf}
.ntf .acts{display:flex;gap:18px;margin-top:12px;font-size:13px;font-weight:600;color:#7cacf8}
.feed{position:absolute;inset:30px 0 0;padding:14px;display:flex;flex-direction:column;gap:12px;opacity:.5}
.feed i{display:block;background:#1d1d22;border-radius:10px}

/* ---------- Windows shared chrome ---------- */
.desk{position:relative;overflow:hidden;border-radius:10px;background:radial-gradient(60% 70% at 70% 60%,#1e3f8f 0%,transparent 60%),radial-gradient(50% 50% at 30% 30%,#20185a 0%,transparent 70%),#05070f;flex:none;border:1px solid #2b2b31}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:#1c1c20e6;backdrop-filter:blur(20px);border-top:1px solid #ffffff10;display:flex;align-items:center;padding:0 10px;z-index:4}
.taskbar .mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.taskbar .mid i{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.taskbar .tray{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:#eee}
.taskbar .tray .clk{text-align:right;line-height:1.3}
.taskbar .tray .me{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#ffffff18;position:relative}
.win{position:relative;border-radius:9px;overflow:hidden;border:1px solid #3a3a42;box-shadow:0 18px 48px #000a;display:flex;flex-direction:column;flex:none}
.win .tb{height:34px;flex:none;display:flex;align-items:center;padding-left:12px;gap:8px;font-size:12px;color:#d8d8de}
.win .tb .ctl{margin-left:auto;display:flex;height:100%}
.win .tb .ctl span{width:46px;display:flex;align-items:center;justify-content:center;color:#cfcfd6}
.win .body{flex:1;position:relative;overflow:hidden;display:flex}
/* Brave, shared, not ours */
.brave{background:#202124;border-color:#3b3b40}
.brave .tabs{height:36px;background:#141417;display:flex;align-items:flex-end;padding:0 8px;gap:4px}
.brave .tab{height:30px;background:#202124;border-radius:8px 8px 0 0;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:#e8eaed;width:220px}
.brave .tbar{height:40px;background:#202124;display:flex;align-items:center;gap:12px;padding:0 12px;color:#9aa0a6;border-bottom:1px solid #2e2e33}
.brave .url{flex:1;height:28px;border-radius:14px;background:#2e2f33;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#e8eaed;gap:8px}
.brave .tabs .ctl{display:flex;height:36px;color:#cfcfd6}.brave .tabs .ctl span{width:46px;display:flex;align-items:center;justify-content:center}
.brave .err{flex:1;padding:70px 90px;color:#9aa0a6;font-family:"Segoe UI",Roboto,"DejaVu Sans",sans-serif}
.brave .err h1{font-size:24px;font-weight:400;color:#e8eaed;margin:22px 0 12px}
.brave .err p{font-size:14px;line-height:1.5}
.brave .err .code{font-size:12px;margin-top:14px;color:#80868b}

/* ---------- widgets shared ---------- */
.wg{position:relative;overflow:hidden;flex:none;font-family:Roboto,"DejaVu Sans",sans-serif}
.wspec{display:flex;gap:18px;align-items:flex-start;padding:22px;border-radius:18px;background:radial-gradient(80% 80% at 20% 20%,#28304a,transparent 70%),radial-gradient(70% 70% at 90% 90%,#3a2747,transparent 70%),#0a0b10;border:1px solid #23232a}
.wlbl{font-size:11px;color:#9a9aa6;margin-top:7px}

/* ---------- switcher (hidden by renderer) ---------- */
.switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:16px;background:#17171ce8;border:1px solid #33333b;backdrop-filter:blur(16px);box-shadow:0 10px 30px #000a;z-index:100;font-size:12.5px;white-space:nowrap}
.switcher .proto{font-weight:800;letter-spacing:.12em;font-size:10.5px;color:#111;background:#f2b55f;padding:4px 7px;border-radius:6px}
.switcher button{padding:6px 10px;border-radius:9px;color:#cfcfd8}
.switcher button:hover{background:#ffffff12}
.switcher button.on{background:#ffffff1f;color:#fff;font-weight:600}
.switcher .vn{min-width:150px;text-align:center;font-weight:600;color:#fff}
.switcher .sep{width:1px;height:22px;background:#33333b;margin:0 4px}

/* ======================================================
   DESIGN 1: STUB (opus-1)  ticket stack, tear by drag
   ====================================================== */
.v1{--bg:#0b0b0f;--gl:rgba(255,255,255,.055);--gl2:rgba(255,255,255,.085);--ln:rgba(255,255,255,.09);--tx:#f5f2ec;--mu:#a09fa8;--dm:#66656f;--am:#ffb547;--co:#ff7d5a;--mint:#57e3ad;--night:#8f9bff;--red:#ff6f6f;background:var(--bg);color:var(--tx)}
.v1 .blobs{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 35% at 15% 18%,#ff9a4a2e,transparent 70%),radial-gradient(55% 35% at 95% 55%,#7b5cff24,transparent 70%),radial-gradient(60% 30% at 30% 100%,#ff6a4a1c,transparent 70%)}
.v1.curf .blobs{background:radial-gradient(60% 35% at 15% 18%,#4a5cff2a,transparent 70%),radial-gradient(55% 35% at 95% 55%,#2b3a8a33,transparent 70%)}
.v1.run .blobs{background:radial-gradient(60% 35% at 15% 18%,#2fe3a326,transparent 70%),radial-gradient(55% 35% at 95% 55%,#ff9a4a1c,transparent 70%)}
.v1 .glass{background:var(--gl);border:1px solid var(--ln);border-radius:20px;backdrop-filter:blur(18px)}
.v1 .top{display:flex;align-items:center;gap:8px;padding:8px 18px 4px;position:relative}
.v1 .brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px;letter-spacing:.01em}
.v1 .brand svg{color:var(--am)}
.v1 .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--gl2);color:var(--mu)}
.v1 .pill.lk{color:#ffd59a;background:#ffb5471f}
.v1 .pill.rn{color:var(--mint);background:#57e3ad1f}
.v1 .pill.cf{color:var(--night);background:#8f9bff1f}
.v1 .pill.fl{color:#ffcf6b;background:#ffb5472e}
.v1 .ib{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--gl2);color:var(--tx)}
.v1 .pad{padding:0 18px;position:relative}
.v1 .sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);padding:16px 18px 8px;display:flex;justify-content:space-between}
.v1 .sec span{letter-spacing:0;text-transform:none;font-weight:500;color:var(--dm)}
/* bank head */
.v1 .bh{display:flex;align-items:flex-end;gap:12px;padding:10px 18px 14px;position:relative}
.v1 .bh .big{font-size:58px;line-height:.9;font-weight:800;letter-spacing:-.03em}
.v1 .bh .of{white-space:nowrap;font-size:15px;color:var(--mu);font-weight:600;margin-bottom:4px}
.v1 .bh .meta{flex:1;display:flex;flex-direction:column;gap:7px;padding-bottom:3px}
.v1 .bh .lbl{font-size:12.5px;color:var(--mu)}
.v1 .pips{display:flex;gap:3px}
.v1 .pips i{flex:1;height:6px;border-radius:3px;background:#ffffff14;display:block;min-width:6px}
.v1 .pips i.on{background:linear-gradient(90deg,var(--am),var(--co))}
.v1.curf .pips i.on{background:#8f9bff88}
.v1 .streak{white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--mu);gap:2px;padding-bottom:2px}
.v1 .streak b{display:flex;align-items:center;gap:4px;color:#ffc56b;font-size:15px}
/* ticket stack */
.v1 .tk{position:relative;height:var(--th);margin-bottom:var(--tb)}
.v1 .tk-under{position:absolute;left:0;right:0;top:0;height:var(--th);border-radius:16px;background:linear-gradient(135deg,#b97a35,#a5503a)}
.v1 .tk-top{position:absolute;inset:0;display:flex;filter:drop-shadow(0 10px 18px #0008)}
.v1 .tk-stub{width:var(--sw);flex:none;background:linear-gradient(160deg,#ffcf7a,#ffad55);color:#3a1d05;border-radius:16px 0 0 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  -webkit-mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.v1 .tk-stub .n{font-size:calc(var(--th)*.36);font-weight:800;line-height:1}
.v1 .tk-stub .l{font-size:9px;font-weight:800;letter-spacing:.12em}
.v1 .tk-body{flex:1;min-width:0;overflow:hidden;position:relative;background:linear-gradient(120deg,#ffb04f,#ff7e5c);color:#2d1204;border-radius:0 16px 16px 0;padding:12px 16px 12px 20px;display:flex;flex-direction:column;justify-content:space-between;touch-action:none;user-select:none;cursor:grab;
  -webkit-mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.v1 .tk-body:before{content:"";position:absolute;left:0;top:12px;bottom:12px;border-left:2px dashed #5a2a0a55}
.v1 .tk-body .t1{white-space:nowrap;overflow:hidden;font-size:9.5px;font-weight:800;letter-spacing:.14em;opacity:.75}
.v1 .tk-body .t2{font-size:calc(var(--th)*.3);white-space:nowrap;font-weight:800;letter-spacing:-.01em;line-height:1}
.v1 .tk-body .t3{white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
.v1 .tk-body .t3 .arr{margin-left:auto;display:flex;gap:1px;opacity:.8}
.v1 .tk-body.off{cursor:default;filter:saturate(.25) brightness(.62)}
.v1 .tk-body.night{background:linear-gradient(120deg,#323a6e,#252a4f);color:#c9cfff;cursor:not-allowed}
.v1 .tk-body.night:before{border-color:#c9cfff40}
.v1 .tk-stub.night{background:linear-gradient(160deg,#3d4682,#2d3463);color:#dfe3ff}
.v1 .tk.full .tk-top{filter:drop-shadow(0 0 22px #ffb54766) drop-shadow(0 10px 18px #0008)}
.v1 .tk-body.fly{transition:transform .32s ease-in,opacity .32s ease-in;opacity:0}
.v1 .tk-body.snap{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.v1 .tk.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* unlock card */
.v1 .uc{padding:14px 16px;position:relative}
.v1 .uc .k{font-size:10.5px;font-weight:800;letter-spacing:.12em;display:flex;align-items:center;gap:6px;color:var(--mu)}
.v1 .uc .big{font-size:52px;font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:4px 0 8px}
.v1 .uc .mid{font-size:24px;font-weight:700;margin:6px 0 4px}
.v1 .uc p{font-size:12.5px;color:var(--mu);line-height:1.45}
.v1 .uc p b{color:var(--tx);font-weight:600}
.v1 .bar{height:6px;border-radius:3px;background:#ffffff14;overflow:hidden}
.v1 .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--am),var(--co))}
.v1 .bar.mint i{background:var(--mint)}
.v1 .bar.night i{background:var(--night)}
/* progress rows */
.v1 .pr{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;padding:7px 0}
.v1 .pr .i{grid-row:span 2;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--gl2);color:var(--am)}
.v1 .pr .n{font-size:13px;font-weight:600}
.v1 .pr .n small{font-weight:400;color:var(--dm);font-size:11px;margin-left:4px}
.v1 .pr .v{font-size:12px;color:var(--mu);text-align:right}
.v1 .pr .bar{grid-column:2/4;height:4px}
.v1 .pr.fz .bar i{background:#ff6f6f88}
/* history rows */
.v1 .hr{display:grid;grid-template-columns:40px 1fr auto;gap:0 10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.v1 .hr:first-child{border-top:0}
.v1 .hr .t{font-size:11.5px;color:var(--dm)}
.v1 .hr .w{font-size:13px;line-height:1.25}
.v1 .hr .w small{display:block;font-size:11px;color:var(--dm)}
.v1 .chipd{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:#ffb54724;color:#ffc67a}
.v1 .chipd.m{background:#57e3ad1f;color:var(--mint)}
.v1 .chipd.x{background:#ff6f6f1c;color:var(--red);font-weight:700;font-size:11px}
/* attempts */
.v1 .att{display:grid;grid-template-columns:22px 70px 1fr 22px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.v1 .att .b{height:8px;border-radius:4px;background:#ffffff10;overflow:hidden}
.v1 .att .b i{display:block;height:100%;background:#ff7d5acc;border-radius:4px}
.v1 .att .c{text-align:right;color:var(--mu)}
/* settings */
.v1 .hdr{display:flex;align-items:center;gap:10px;padding:10px 18px 4px;font-size:20px;font-weight:800;position:relative}
.v1 .grp{padding:4px 14px;margin:0 18px;position:relative}
.v1 .st{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;padding:11px 0;border-top:1px solid var(--ln)}
.v1 .st:first-child{border-top:0}
.v1 .st .l{flex:1;min-width:0}
.v1 .st .l .n{font-size:13.5px;font-weight:600}
.v1 .st .l .s{font-size:11px;color:var(--dm);margin-top:2px}
.v1 .pend{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;font-weight:600;color:#ffcf8a;background:#ffb5471c;padding:3px 8px;border-radius:7px}
.v1 .pend u{color:var(--mu);font-weight:500;margin-left:4px;cursor:pointer}
.v1 .stp{display:flex;align-items:center;background:#ffffff0d;border:1px solid var(--ln);border-radius:12px;flex:none}
.v1 .stp button{width:32px;height:34px;font-size:18px;font-weight:600;color:var(--tx);display:flex;align-items:center;justify-content:center}
.v1 .stp button.tight{color:#ffc67a}
.v1 .stp span{min-width:58px;text-align:center;font-size:13.5px;font-weight:700}
.v1 .fn{font-size:11.5px;color:var(--mu);padding:7px 20px 2px;position:relative;line-height:1.4}
.v1 .fn b{color:#ffc67a}
.v1 .src{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.v1 .src:first-child{border-top:0}
.v1 .src .s{margin-left:auto;font-size:11.5px;color:var(--mu)}
.v1 .src .ok{color:var(--mint);font-size:11px;font-weight:700}
/* blocked */
.v1 .blk{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 22px 8px;position:relative}
.v1 .blk h2{font-size:23px;font-weight:800;margin:14px 0 6px;letter-spacing:-.01em}
.v1 .blk p{font-size:13px;color:var(--mu);line-height:1.45}
.v1 .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:15px;font-size:14px;font-weight:700;background:var(--gl2);border:1px solid var(--ln);color:var(--tx);width:100%}
.v1 .btn.pri{background:var(--mint);color:#06281a;border:0}
.v1 .hint{font-size:11px;color:var(--dm);text-align:center;margin-top:8px}
/* tablet */
.v1 .tw{flex:1;display:flex;min-height:0;position:relative}

/* ---------------- dial geometry (design 2, also used by its icon) ---------------- */
function arc(cx, cy, r, a0, a1){
  const p = a => [cx + r*Math.cos((a-90)*Math.PI/180), cy + r*Math.sin((a-90)*Math.PI/180)];
  const [x0,y0] = p(a0), [x1,y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function miniDialSvg(size, filled, color, empty='#ffffff22'){
  const c = size/2, r = size/2 - size*.09, sw = size*.11;
  let out = '';
  for (let i=0;i<12;i++) out += `<path d="${arc(c,c,r,i*30+5,i*30+25)}" stroke="${i<filled?color:empty}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${out}</svg>`;
}

}
function w1Btn(s){

}
function w1Medium(s){
  const m = mode(s), btn = w1Btn(s);

function w1Large(s){
  const m = mode(s);
  const head = m==='running' ? `<div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:11px;font-weight:800;letter-spacing:.1em;color:#57e3ad">UNLOCK RUNNING</span><span style="font-size:11px;color:#a09fa8">${s.bank} in the Bank</span></div><div class="num js-left" style="font-size:44px;font-weight:300;line-height:1.1">${fmtLeft(s.unlock)}</div><div style="height:5px;border-radius:3px;background:#ffffff14"><div class="js-bar" style="height:100%;width:${(s.unlock/600*100).toFixed(1)}%;background:#57e3ad;border-radius:3px"></div></div>`

/* =====================================================================
   DESIGN 2: TWELVE
   ===================================================================== */
const V2 = {};
const segColor = (s, i) => {
  const m = mode(s);
  if (i >= s.bank) return '#ffffff12';
  return {locked:'#8b7bff', running:'#8b7bff', curfew:'#4a5397', full:'#fbbf24'}[m];
};
function dial2(s, size=250, o={}){
  const c = size/2, r = c - size*.05, sw = size*.06, m = mode(s);
  let segs = '';
  for (let i=0;i<12;i++) segs += `<path class="seg" d="${arc(c,c,r,i*30+4,i*30+26)}" stroke="${segColor(s,i)}" stroke-width="${sw}" stroke-linecap="round" fill="none" ${i<s.bank&&m!=='curfew'?`style="filter:drop-shadow(0 0 ${size*.02}px ${m==='full'?'#fbbf2488':'#8b7bff88'})"`:''}/>`;
  const ir = r - size*.115, C = 2*Math.PI*ir;
  const ring = m==='running'
    ? `<circle cx="${c}" cy="${c}" r="${ir}" stroke="#ffffff10" stroke-width="${size*.022}" fill="none"/><circle class="js-ring" data-c="${C}" cx="${c}" cy="${c}" r="${ir}" stroke="#5eead4" stroke-width="${size*.022}" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s.unlock/600)}" transform="rotate(-90 ${c} ${c})"/>`
    : `<circle cx="${c}" cy="${c}" r="${ir}" stroke="#ffffff08" stroke-width="${size*.022}" fill="none"/><circle class="holdring" cx="${c}" cy="${c}" r="${ir}" stroke="${m==='full'?'#fbbf24':'#bdb2ff'}" stroke-width="${size*.022}" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 ${c} ${c})"/>`;
  const d = size*.62, k = size/250;
  const center = {
    locked:`<div class="n num" style="font-size:${68*k}px">${s.bank}</div><div class="u" style="font-size:${Math.max(9,12*k)}px">${size<200?'banked':'Vouchers banked'}</div>${o.noHold?'':`<div class="h" style="font-size:${11.5*k}px">${ic('press',13*k)} Hold to Redeem</div>`}`,
    running:`<div class="u" style="font-size:${Math.max(8.5,11*k)}px;color:var(--mint);font-weight:700;letter-spacing:.08em">UNLOCKED</div><div class="n num js-left" style="font-size:${50*k}px;margin-top:2px">${fmtLeft(s.unlock)}</div><div class="u" style="font-size:${Math.max(9,12*k)}px">ends ${endsAt(s)}</div>${size<200?'':`<div class="u" style="font-size:${11*k}px;margin-top:${8*k}px">${s.bank} still banked</div>`}`,
    curfew:`<div style="color:var(--night)">${ic('moon',30*k)}</div><div class="n num" style="font-size:${40*k}px;margin-top:4px;color:#c9cdf5">${s.bank}</div><div class="u" style="font-size:${Math.max(9,12*k)}px">${size<200?'until 06:00':'Curfew until 06:00'}</div>`,
    full:`<div class="n num" style="font-size:${64*k}px;color:#fde4a0">${s.bank}</div><div class="u" style="font-size:${Math.max(9,12*k)}px;color:#e9c46a">Bank full</div>${o.noHold?'':`<div class="h" style="font-size:${11.5*k}px;color:#fde4a0;background:#fbbf2422">${ic('press',13*k)} Hold to Redeem</div>`}`,
  }[m];
  const holdable = (m==='locked'||m==='full') && !o.noHold;
  return `<div class="dialw" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}${ring}</svg>
    <div class="dc" ${holdable?'data-hold':''} style="width:${d}px;height:${d}px">${center}</div></div>`;
}
const pill2 = s => { const m = mode(s); return `<span class="st ${({locked:'lk',running:'rn',curfew:'cf',full:'fl'})[m]}"><i></i>${({locked:'Locked',running:'Unlocked',curfew:'Curfew',full:'Bank full'})[m]}</span>`; };
const caption2 = s => ({
  locked:`Hold the dial for one breath to open all Distractions for <b>${UNLOCK_MIN} min</b>.`,
  running:`Distractions are open. Everything locks at <b>${endsAt(s)}</b>. One Unlock at a time.`,
  curfew:`Curfew, 22:00 to 06:00. Nothing can be Redeemed for <b>${until6(s.clock)}</b>.`,
  full:`<span style="color:#e9c46a">Every slot is full, so new earnings are forfeited.</span> Hold to take a break.`})[mode(s)];
const PCOL = {task:['#4ade80','#4ade8022'], focus:['#a78bfa','#a78bfa22'], workout:['#fb7185','#fb718522'], anki:['#60a5fa','#60a5fa22']};
function tile2(s, p){
  const [c,bg] = PCOL[p.k], fz = mode(s)==='full';
  return `<div class="tile"><div class="h"><span class="o" style="background:${bg};color:${c}">${ic(KIND_IC[p.k],14)}</span>${p.n}</div>
   <div class="v num">${p.each?`${tasksToday(s)}<small>today, +1 each</small>`:`${p.cur}<small>/ ${p.max} ${p.k==='workout'?'zone min':'min'}</small>`}</div>
   <div class="hb"><i style="width:${p.each?100:p.cur/p.max*100}%;background:${fz?'#f8717188':c};${p.each?'opacity:.35':''}"></i></div></div>`;
}
function week2(){
  const max = Math.max(...WEEK.days);
  return `<div class="week">${WEEK.days.map((n,i)=>`<div><i style="background:rgba(139,123,255,${(.18+.75*n/max).toFixed(2)})">${n}</i>${WEEK.dn[i]}</div>`).join('')}</div>`;
}

function zone2(key){
  const r = SET[key], span = r.max - r.min, pos = v => ((v - r.min)/span*100).toFixed(1);
  const kv = pos(r.v);
  const tz = r.tight===-1 ? `left:0;width:${kv}%` : `left:${kv}%;right:0`;
  const ghost = r.p!=null ? `<div class="gh" style="left:${pos(r.p)}%"></div><div class="gl" style="left:${pos(r.p)}%">${r.f(r.p)} at 06:00</div>` : '';
  const tc = r.tight===-1 ? kv/2 : (100+ +kv)/2, lc = r.tight===-1 ? (100+ +kv)/2 : kv/2;
  return `<div class="rule"><div class="h"><span>${r.n}</span><b class="num">${r.f(r.v)}</b></div><div class="s">${r.s}</div>
    <div class="zs"><div class="tr"></div><div class="tz" style="${tz}"></div>${ghost}<div class="kn" style="left:${kv}%"></div></div>
    <div class="zl" style="position:relative;height:14px"><span class="n" style="position:absolute;left:${tc}%;transform:translateX(-50%)">now</span><span class="w" style="position:absolute;left:${lc}%;transform:translateX(-50%)">06:00</span></div></div>`;
}
function curfew2(){
  /* 18:00 to 10:00 window, 16 h */
  const a = SET.cstart.v, b = SET.cend.v, base = 18*60, span = 16*60;

  return `<div class="rule"><div class="h"><span>Curfew</span><b class="num">${hm(a)} to ${hm(b)}</b></div><div class="s">No Redeeming in this window</div>
    <div style="position:relative;height:30px;margin:10px 4px 0"><div style="position:absolute;left:0;right:0;top:10px;height:10px;border-radius:5px;background:#ffffff0c"></div>
      <div style="position:absolute;left:${x(a)}%;width:${(x(b)-x(a)).toFixed(1)}%;top:10px;height:10px;border-radius:5px;background:linear-gradient(90deg,#4a5397,#7383e0)"></div>
      <div class="kn" style="position:absolute;top:6px;left:${x(a)}%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff"></div><div style="position:absolute;top:6px;left:${x(b)}%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff"></div></div>

function heat2(weeks=12){
  let seed = 7, cells = '';
  const rnd = () => (seed = (seed*9301 + 49297) % 233280) / 233280;
  const total = weeks*7, todayIdx = total - 6; /* Tuesday of the last week (weeks start Monday) */
  for (let i=0;i<total;i++){
    let n;
    if (i > todayIdx) { cells += `<i style="background:transparent;border:1px dashed #ffffff10"></i>`; continue; }
    const back = todayIdx - i;
    n = back < 7 ? WEEK.days[6-back] : Math.floor(rnd()*7);
    cells += `<i title="${n}" style="background:${n===0?'#ffffff0a':`rgba(139,123,255,${(.15+.85*n/6).toFixed(2)})`};${i===todayIdx?'box-shadow:0 0 0 1.5px #fff':''}"></i>`;
  }
  return `<div class="hm">${cells}</div>`;
}

        <div style="font-size:11.5px;color:#8f89aa;margin-top:8px;line-height:1.4">${{locked:'Tap to Redeem. You will hold to confirm.',running:`Distractions open. Locks at ${endsAt(s)}.`,curfew:`Curfew until 06:00, ${until6(s.clock)} left.`,full:'Full. New earnings are forfeited.'}[m]}</div>
        <div style="font-size:11px;color:#fbbf24;margin-top:6px">${ic('flame',11)} ${WEEK.streak}-day streak</div></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${PROG.map(p=>`<div style="background:#ffffff08;border-radius:10px;padding:6px 8px"><div style="display:flex;justify-content:space-between;font-size:10.5px"><span>${p.n}</span><span class="num" style="color:#8f89aa">${p.each?'+1':`${p.cur}/${p.max}`}</span></div><div style="height:3px;border-radius:2px;background:#ffffff12;margin-top:5px"><div style="height:100%;width:${p.each?100:p.cur/p.max*100}%;background:${PCOL[p.k][0]};${p.each?'opacity:.35':''}"></div></div></div>`).join('')}</div>
    <div style="display:flex;gap:4px;align-items:flex-end;margin-top:auto">${WEEK.days.map((n,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:#625c7c"><div style="width:100%;height:${6+n*3.5}px;border-radius:4px;background:rgba(139,123,255,${(.25+.6*n/6).toFixed(2)})"></div>${WEEK.dn[i]}</div>`).join('')}</div>
    <div style="font-size:10.5px;color:#8f89aa;text-align:center">${WEEK.earned} earned, ${WEEK.spent} Redeemed, and ${WEEK.forfeited} forfeited in 7 days</div></div>`;
}
V2.widgets = {small:w2Small, medium:w2Medium, large:w2Large};

/* =====================================================================
   device compositions
   ===================================================================== */
const DESIGNS = {
  'opus-1': {name:'Stub', tag:'Tear a ticket off the Bank to Redeem', R:V1},
  'opus-2': {name:'Twelve', tag:'Hold the 12-slot dial for one breath to Redeem', R:V2},
};
const VKEYS = Object.keys(DESIGNS);
const cap = (title, who, note='') => `<div class="cap"><b>${title}</b> ${who==='sys'?'<span class="sys">drawn by the system, not ours</span>':who}${note?`<span class="note">${note}</span>`:''}</div>`;
const phone = inner => `<div class="phone">${inner}</div>`;
const tablet = inner => `<div class="tablet">${inner}</div>`;

function renderPhone(s, v){
  const R = DESIGNS[v].R, m = mode(s);
  return `<div class="row">
   <div class="cell">${cap('Home','ours', v==='opus-1'?'Drag the ticket right to tear it.':'Press and hold the centre of the dial.')}${phone(R.phoneHome(s))}</div>
   <div class="cell">${m==='running'?cap('Notification','<span class="sys">Android draws it; our text</span>','No pause dialog while an Unlock runs.'):cap('Pause dialog','sys','Same for both designs; we set the text and the second button.')}${phone(sysDialog(s,v))}</div>
   <div class="cell">${cap('Blocked screen','ours','After tapping Open Voucher.')}${phone(R.phoneBlocked(s))}</div>
   <div class="cell">${cap('Settings','ours', v==='opus-1'?'Steppers.':'Zone sliders.')}${phone(R.phoneSettings(s))}</div></div>`;
}
function renderTablet(s, v){
  const R = DESIGNS[v].R;
  return `<div class="cell">${cap('Home','ours','Galaxy Tab S10 Ultra, landscape.')}${tablet(R.tabletHome(s))}</div>
    <div class="cell">${cap('Settings','ours')}${tablet(R.tabletSettings(s))}</div>`;
}
function renderWindows(s, v){
  const R = DESIGNS[v].R;
  const trayDesk = `<div class="desk" style="width:520px;height:610px">${winFrame('', 'Obsidian', app('obsidian',16,4), 460, 380, '<div style="flex:1;background:#1e1e22"></div>', 'position:absolute;left:24px;top:24px;opacity:.5')}
     <div style="position:absolute;right:12px;bottom:60px;z-index:5">${R.winFlyout(s)}</div>${taskbar(s,v,true)}</div>`;
  const steamDesk = `<div class="desk" style="width:700px;height:470px"><div style="position:absolute;left:40px;top:24px">${R.winSteam(s)}</div>${taskbar(s,v)}</div>`;
  return `<div class="row">
     <div class="cell">${cap('Main window','ours','Tauri app.')}${R.winMain(s)}</div>
     <div class="cell">${cap('Tray flyout','ours','Click the tray icon. This is where blocked websites get Redeemed.')}${trayDesk}</div></div>
   <div class="row">
     <div class="cell">${cap(mode(s)==='running'?'Steam during an Unlock':'Steam opened','ours',mode(s)==='running'?'Shown when Steam starts during an Unlock.':'The service closes Steam, then shows our window.')}${steamDesk}</div>
     <div class="cell">${cap(mode(s)==='running'?'Brave during an Unlock':'Blocked site in Brave','sys', mode(s)==='running'?'The policy is lifted while the Unlock runs, so the site loads.':'Brave\'s own page; we cannot style it. Redeem from the tray.')}${braveBlocked(s)}</div></div>
   <div class="row"><div class="cell">${cap('Settings window','ours')}${R.winSettings(s)}</div>
     <div class="cell" style="max-width:520px">${cap('Notes','')}<div class="cap" style="font-size:12.5px;line-height:1.6;color:#a2a1ad">The tray icon gains a mint dot while an Unlock runs. Hovering it shows "Voucher: ${s.bank} banked${s.unlock?`, Unlock ${fmtLeft(s.unlock)} left`:''}". Brave blocking is a managed policy (URLBlocklist), which is why its page carries Brave's wording and not ours.</div></div></div>`;
}
function homeIcons(list, size=48){
  return list.map(([k,n])=>`<div class="lapp">${app(k,size)}<span>${n}</span></div>`).join('');
}
function renderWidgets(s, v){
  const W = DESIGNS[v].R.widgets;
  const p1 = `<div class="scr"><div class="wall"></div>${sbar(s.clock)}
     <div style="position:absolute;inset:44px 16px 0;display:flex;flex-direction:column;gap:16px">
       <div style="display:flex;gap:16px">${W.small(s)}<div class="lgrid" style="flex:1;gap:14px 4px;align-content:start;grid-template-columns:repeat(2,1fr)">${homeIcons([['todoist','Todoist'],['obsidian','Obsidian'],['anki','AnkiDroid'],['reader','Reader']],44)}</div></div>
       ${W.medium(s)}
       <div class="lgrid" style="gap:14px 8px">${homeIcons([['instagram','Instagram'],['youtube','YouTube'],['reddit','Reddit'],['maps','Maps']],44)}</div></div>
     <div class="dock">${app('phone',46)}${app('msg',46)}${app('brave',46)}${app('cam',46)}</div><div class="navpill"></div></div>`;
  const p2 = `<div class="scr"><div class="wall" style="filter:hue-rotate(30deg)"></div>${sbar(s.clock)}
     <div style="position:absolute;inset:44px 16px 0;display:flex;flex-direction:column;gap:16px">${W.large(s)}
       <div class="lgrid" style="gap:14px 8px">${homeIcons([['health','Health'],['moon','Moon+'],['clickup','ClickUp'],['files','Files']],44)}</div></div>
     <div class="dock">${app('phone',46)}${app('msg',46)}${app('brave',46)}${app('cam',46)}</div><div class="navpill"></div></div>`;
  const z = 1.5;
  const tab = `<div class="scr"><div class="wall"></div>${sbar(s.clock)}
     <div style="position:absolute;left:40px;top:50px;display:flex;gap:40px;align-items:flex-start">
       <div style="zoom:${z}">${W.large(s)}</div>
       <div style="display:flex;flex-direction:column;gap:${24}px"><div style="zoom:${z}">${W.medium(s)}</div>
         <div style="display:flex;gap:30px;align-items:flex-start"><div style="zoom:${z}">${W.small(s)}</div><div class="lgrid" style="grid-template-columns:repeat(2,1fr);gap:20px 26px">${homeIcons([['todoist','Todoist'],['obsidian','Obsidian'],['anki','AnkiDroid'],['reader','Reader']],56)}</div></div></div>
       <div class="lgrid" style="grid-template-columns:repeat(2,1fr);gap:22px 22px">${homeIcons([['instagram','Instagram'],['youtube','YouTube'],['reddit','Reddit'],['maps','Maps'],['health','Health'],['moon','Moon+'],['clickup','ClickUp'],['files','Files']],56)}</div></div>
     <div class="dock" style="left:50%;right:auto;width:420px;transform:translateX(-50%);bottom:16px">${app('phone',52)}${app('msg',52)}${app('brave',52)}${app('cam',52)}${app('maps',52)}</div></div>`;
  const rv = v==='opus-1'
    ? 'RemoteViews only: a ticket-shaped background drawable, TextViews in the system font, horizontal ProgressBars, a Chronometer counting down, and tap targets. Tapping Redeem opens Voucher to confirm the tear, since widgets cannot take a drag.'
    : 'RemoteViews only: the dial is a bitmap the app redraws into an ImageView when the Bank changes; the countdown in the middle is a Chronometer laid over it. Tapping opens the hold-to-Redeem screen, since widgets cannot detect a hold.';
  return `<div class="row">
     <div class="cell">${cap('Phone home, page 1','ours','Small 2×2 and medium 4×2.')}${phone(p1)}</div>
     <div class="cell">${cap('Phone home, page 2','ours','Large 4×4.')}${phone(p2)}</div>
     <div class="cell" style="width:640px">${cap('Sizes at 1:1','ours',rv)}
       <div class="wspec" style="flex-wrap:wrap">
         <div>${W.small(s)}<div class="wlbl">Small 2×2</div></div>
         <div>${W.medium(s)}<div class="wlbl">Medium 4×2</div></div>
         <div>${W.large(s)}<div class="wlbl">Large 4×4</div></div></div></div></div>
   <div class="cell">${cap('Tablet home','ours','Same widgets, resized by the launcher grid.')}${tablet(tab)}</div>`;
}

/* =====================================================================
   state, render, interaction
   ===================================================================== */
const P = new URLSearchParams(location.search);
let V = VKEYS.includes(P.get('variant')) ? P.get('variant') : VKEYS[0];
let ST = STATES[P.get('state')] ? P.get('state') : 'locked';
let DEV = ['phone','tablet','windows','widgets'].includes(P.get('device')) ? P.get('device') : 'phone';
let cur = JSON.parse(JSON.stringify(STATES[ST]));
let live = false;

function render(){
  const d = DESIGNS[V], stage = document.getElementById('stage');
  const body = {phone:renderPhone, tablet:renderTablet, windows:renderWindows, widgets:renderWidgets}[DEV](cur, V);
  stage.innerHTML = `<div class="stage-head"><b>${d.name}</b><span>${d.tag}</span><span class="k">${V} / ${cur.label} / ${DEV}</span></div>${body}`;
  const sw = document.getElementById('sw');
  sw.innerHTML = `<span class="proto">PROTOTYPE</span><button data-nav="-1" title="Previous design (Left arrow)">←</button><span class="vn">${V}: ${d.name}</span><button data-nav="1" title="Next design (Right arrow)">→</button><span class="sep"></span>`
    + Object.keys(STATES).map(k=>`<button data-state="${k}" class="${k===ST?'on':''}">${STATES[k].label}</button>`).join('')
    + `<span class="sep"></span>` + ['phone','tablet','windows','widgets'].map(k=>`<button data-dev="${k}" class="${k===DEV?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
  const q = new URLSearchParams({variant:V, state:ST, device:DEV});
  history.replaceState(null, '', '?' + q.toString());
}
function setVariant(dir){ const i = VKEYS.indexOf(V); V = VKEYS[(i + dir + VKEYS.length) % VKEYS.length]; render(); }
function redeem(){
  if (cur.curfew || cur.unlock || cur.bank < 1) return false;
  cur = {...cur, bank:cur.bank-1, unlock:UNLOCK_MIN*60, label:'Unlock running (live)', extra:[...(cur.extra||[]), {t:cur.clock, w:'Redeemed', src:'10 min Unlock', k:'redeem', d:-1}]};
  live = true; render(); return true;
}

document.getElementById('sw').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.nav) setVariant(+b.dataset.nav);
  if (b.dataset.state) { ST = b.dataset.state; cur = JSON.parse(JSON.stringify(STATES[ST])); render(); }
  if (b.dataset.dev) { DEV = b.dataset.dev; render(); }
});
document.addEventListener('keydown', e => {
  live = true;
  if (e.key === 'ArrowLeft') setVariant(-1);
  if (e.key === 'ArrowRight') setVariant(1);
});

/* steppers (design 1): tightening applies now, loosening queues for 06:00 */
document.getElementById('stage').addEventListener('click', e => {
  const b = e.target.closest('[data-step]');
  if (b) {
    const r = SET[b.dataset.step], dir = +b.dataset.dir, clamp = x => Math.max(r.min, Math.min(r.max, x));
    if (dir === r.tight) {
      if (r.p != null) { r.p = clamp(r.p + dir*r.step); if ((r.p - r.v)*r.tight >= 0) r.p = null; }
      else r.v = clamp(r.v + dir*r.step);
    } else {
      const np = clamp((r.p ?? r.v) + dir*r.step); r.p = np === r.v ? null : np;
    }
    render(); return;
  }
  const c = e.target.closest('[data-cancel]');
  if (c) { SET[c.dataset.cancel].p = null; render(); }
});

/* tear by drag (design 1) */
let drag = null;
document.addEventListener('pointerdown', e => {
  live = true;
  const blocked = e.target.closest('[data-tear-blocked]');
  if (blocked) { const tk = blocked.closest('.tk'); tk.classList.remove('shake'); void tk.offsetWidth; tk.classList.add('shake'); return; }
  const el = e.target.closest('[data-tear]');
  if (el) { drag = {el, x:e.clientX, w:el.offsetWidth}; el.setPointerCapture(e.pointerId); el.classList.remove('snap'); el.style.cursor = 'grabbing'; return; }
  const h = e.target.closest('[data-hold]');
  if (h) startHold(h, e);
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = Math.max(0, e.clientX - drag.x);
  drag.el.style.transform = `translateX(${dx}px) rotate(${Math.min(dx*.04, 9)}deg)`;
  drag.el.style.transformOrigin = '0 100%';
});
document.addEventListener('pointerup', e => {
  if (drag) {
    const dx = e.clientX - drag.x, el = drag.el; drag = null;
    if (dx > drag?.w*.45 || dx > el.offsetWidth*.45) {
      el.classList.add('fly'); el.style.transform = `translateX(${el.offsetWidth*1.4}px) rotate(14deg)`;
      setTimeout(redeem, 300);
    } else { el.classList.add('snap'); el.style.transform = ''; el.style.cursor = ''; }
  }
  endHold();
});
document.addEventListener('pointercancel', () => endHold());

/* hold to redeem (design 2) */
let hold = null;
function startHold(h, e){
  const host = h.closest('.dialw') || h;
  host.classList.add('holding');
  hold = {host, t:setTimeout(() => { host.classList.remove('holding'); hold = null; redeem(); }, 1600)};
}
function endHold(){ if (!hold) return; clearTimeout(hold.t); hold.host.classList.remove('holding'); hold = null; }

/* live countdown, only after the first interaction so screenshots stay on the mock numbers */
setInterval(() => {
  if (!live || !cur.unlock) return;
  cur.unlock -= 1;
  if (cur.unlock <= 0) { cur = {...cur, unlock:null, label:'Locked (live)'}; render(); return; }
  document.querySelectorAll('.js-left').forEach(n => n.textContent = fmtLeft(cur.unlock));
  document.querySelectorAll('.js-bar').forEach(n => n.style.width = (cur.unlock/600*100).toFixed(1)+'%');
  document.querySelectorAll('.js-ring').forEach(n => n.setAttribute('stroke-dashoffset', (+n.dataset.c)*(1-cur.unlock/600)));
}, 1000);

render();
</script>
</body>
</html>
